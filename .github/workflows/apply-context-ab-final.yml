name: Apply context A/B final patch

on:
  push:
    branches:
      - "agent/full-sea-ab-current-main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Stage final context A/B patch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and publish final patch
        run: |
          set -euo pipefail
          git apply --check tools/context-ab-final.patch
          git apply tools/context-ab-final.patch
          rm tools/context-ab-final.patch .github/workflows/apply-context-ab-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parameterize and document p125 context corpus"
          git push origin HEAD:agent/full-sea-ab-current-main
