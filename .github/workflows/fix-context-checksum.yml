name: Regenerate context corpus checksum

on:
  push:
    branches:
      - "agent/full-sea-ab-current-main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Regenerate retained context corpus checksum')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate checksum and publish
        run: |
          set -euo pipefail
          cd artifacts/local/p125-context-corpus-20260803
          sha256sum result.json | sed 's#  result.json#  ./result.json#' > SHA256SUMS
          cd ../../..
          rm .github/workflows/fix-context-checksum.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate p125 context corpus checksum"
          git push origin HEAD:agent/full-sea-ab-current-main
