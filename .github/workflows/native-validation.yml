name: Native validation

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      GMP_PREFIX: /usr
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Build
        run: make -j2

      - name: Run native and reference tests
        run: |
          make test
          make test-poly-reduction
          make test-cli
          make test-reference
          make test-factor
          make test-certificate
          make test-eigenvalue-mitm
          make test-modpoly-generator
          make test-weber-modpoly
          make test-weber-curve-generator
          make test-verifier
          make test-vendor
          make test-smooth
          make test-smooth-cache
          make test-exact-smooth
          make test-search-checkpoint
          make test-search-pipeline

      - name: Record polynomial benchmark
        run: make benchmark-poly-reduction
