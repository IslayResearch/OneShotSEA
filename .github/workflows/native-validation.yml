name: Native validation

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      CPPFLAGS: -Iinclude
      LDFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev

      - name: Build current-main benchmark baseline
        run: |
          make -j2 build/benchmark_p125_poly_trusted
          cp build/benchmark_p125_poly_trusted /tmp/benchmark-p125-baseline

      - name: Apply polynomial hot-path candidate
        run: |
          git apply --check tools/poly-hotpath-candidate.patch
          git apply tools/poly-hotpath-candidate.patch
          git diff --check
          make clean

      - name: Pack exact candidate source snapshot
        run: tar --exclude=.git -czf /tmp/oneshotsea-source.tgz .

      - name: Upload exact candidate source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: oneshotsea-source-${{ github.sha }}
          path: /tmp/oneshotsea-source.tgz
          compression-level: 0
          retention-days: 1

      - name: Build candidate
        run: make -j2 all build/benchmark_p125_poly_trusted

      - name: Run portable native and reference tests
        run: |
          make test
          make test-poly-square
          make test-atkin
          make test-progress-audit
          make test-yield-model
          make test-performance-artifacts
          make test-cli
          make test-reference
          make test-factor
          make test-certificate
          make test-eigenvalue-mitm
          make test-modpoly-generator
          make test-weber-modpoly
          make test-weber-curve-generator
          make test-verifier
          make test-vendor
          make test-smooth
          make test-smooth-cache
          make test-exact-smooth
          make test-search-checkpoint
          make test-search-pipeline

      - name: Run exact interleaved p125 polynomial A/B
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            local label="$1"
            local binary="$2"
            local degree="$3"
            local sequence="$4"
            "$binary" frobenius "$degree" 1 \
              > "/tmp/${degree}-${sequence}-${label}.out" \
              2> "/tmp/${degree}-${sequence}-${label}.err"
            printf '%s degree=%s sequence=%s ' "$label" "$degree" "$sequence"
            grep '^timing.elapsed_us=' "/tmp/${degree}-${sequence}-${label}.err"
            sha256sum "/tmp/${degree}-${sequence}-${label}.out"
          }
          for degree in 194 277; do
            run_case baseline /tmp/benchmark-p125-baseline "$degree" 1
            run_case candidate ./build/benchmark_p125_poly_trusted "$degree" 1
            run_case candidate ./build/benchmark_p125_poly_trusted "$degree" 2
            run_case baseline /tmp/benchmark-p125-baseline "$degree" 2
            cmp "/tmp/${degree}-1-baseline.out" "/tmp/${degree}-1-candidate.out"
            cmp "/tmp/${degree}-1-baseline.out" "/tmp/${degree}-2-candidate.out"
            cmp "/tmp/${degree}-1-baseline.out" "/tmp/${degree}-2-baseline.out"
          done
